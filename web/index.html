<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of `flutter build web --base-href /play/futoshiki_adults/`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Futoshiki for Adults: a challenging logic puzzle. Fill the grid so every row and column uses each number once and every inequality sign holds.">
  <meta name="theme-color" content="#F6F3EC">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Futoshiki">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Futoshiki for Adults</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F6F3EC;
      overflow: hidden;
    }
    /* Shown until Flutter has drawn its first frame (removed in
       flutter_bootstrap.js), so the iframe is never a blank box. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      color: #16193A;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(22, 25, 58, 0.15);
      border-top-color: #F2A541;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div>Loading puzzle…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
